steps:
  - name: 'gcr.io/k8s-skaffold/pack'
    entrypoint: 'pack'
    args:
      - 'build'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/repo-ml4bd-actividad-3/servicio-modelo-ml:$COMMIT_SHA'
      - '--builder=gcr.io/buildpacks/builder:latest'
      - '--publish'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'servicio-modelo-ml'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/repo-ml4bd-actividad-3/servicio-modelo-ml:$COMMIT_SHA'
      - '--region=us-central1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

